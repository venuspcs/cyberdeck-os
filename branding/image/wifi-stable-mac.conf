# mt7921e was not in Debian's MAC-change exception list, so NetworkManager
# scanned with a random MAC and connected with the permanent MAC. That
# mismatch fails 802.11 authenticate on some access points, including a
# Starlink Mini on 5 GHz. Scan and connect with one stable MAC instead.
[device]
wifi.scan-rand-mac-address=no

[connection]
wifi.cloned-mac-address=stable
