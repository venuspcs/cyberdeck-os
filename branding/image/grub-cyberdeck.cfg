GRUB_DISTRIBUTOR="Cyberdeck OS"
GRUB_THEME="/usr/share/grub/themes/cyberdeck/theme.txt"
# Show every installed kernel on the main menu. The Debian 13 6.12
# kernel is the fallback when the backports kernel misbehaves.
GRUB_DISABLE_SUBMENU=y
GRUB_TIMEOUT=15
GRUB_TIMEOUT_STYLE=menu
GRUB_GFXMODE=1024x768
GRUB_GFXPAYLOAD_LINUX=1024x768
