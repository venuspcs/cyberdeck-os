---
# Erase disk creates a GPT layout: a small BIOS boot partition, the EFI
# system partition Calamares prepends when the machine is UEFI, and one
# Btrfs root. Alongside and manual partitioning stay available.
# Install alongside and manual keep an existing GPT disk. Erase is the
# path that creates this layout.
efi:
    mountPoint: "/boot/efi"
    recommendedSize: 512MiB
    minimumSize: 32MiB
    label: "EFI"

userSwapChoices:
    - none
initialSwapChoice: none

defaultPartitionTableType: gpt
requiredPartitionTableType: gpt
defaultFileSystemType: "btrfs"
availableFileSystemTypes: ["btrfs"]

lvm:
    enable: false

partitionLayout:
    - name: "biosboot"
      type: "21686148-6449-6E6F-744E-656564454649"
      filesystem: "unformatted"
      size: 1M
    - name: "rootfs"
      filesystem: "btrfs"
      mountPoint: "/"
      size: 100%
