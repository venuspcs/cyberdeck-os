---
showSupportUrl: true
showKnownIssuesUrl: true
showReleaseNotesUrl: false

requirements:
    # Supported machines are 256 GB. The hard stop is lower so a test
    # disk and a small experiment can still be installed.
    requiredStorage: 8
    requiredRam: 1.0
    check:
        - storage
        - ram
        - power
        - root
    required:
        - storage
        - ram
        - root
