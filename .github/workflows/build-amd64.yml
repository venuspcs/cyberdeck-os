name: Build AMD64 ISO

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Package profile
        type: choice
        options:
          - ci
          - full
        default: full
  push:
    paths:
      - "build/amd64/**"
      - "packages/amd64/**"
      - "installer/**"
      - "firstboot/**"
      - ".github/workflows/build-amd64.yml"

concurrency:
  group: amd64-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  iso:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/share/swift /usr/local/share/powershell /usr/local/.ghcup /usr/share/miniconda /opt/az /usr/lib/jvm || true
          sudo docker image prune -af || true
          sudo apt-get clean
          df -h

      - name: Install Debian live-build
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y debootstrap debian-archive-keyring squashfs-tools xorriso grub-efi-amd64-bin grub-pc-bin isolinux syslinux-utils mtools
          curl -fsSL -o /tmp/live-build.deb https://deb.debian.org/debian/pool/main/l/live-build/live-build_20250505+deb13u1_all.deb
          sudo apt-get install -y /tmp/live-build.deb
          lb --version

      - name: Build ISO
        env:
          CYBERDECK_PROFILE: ${{ github.event.inputs.profile || 'full' }}
        run: |
          chmod +x scripts/build-amd64.sh build/amd64/auto/* build/amd64/config/hooks/normal/*.hook.chroot
          sudo -E env CYBERDECK_PROFILE="${CYBERDECK_PROFILE}" scripts/build-amd64.sh "${CYBERDECK_PROFILE}"

      - name: Checksum
        run: |
          cd build/amd64
          sudo sha256sum *.iso | sudo tee SHA256SUMS >/dev/null
          sudo chmod 644 *.iso SHA256SUMS
          sha256sum -c SHA256SUMS
          ls -lh *.iso SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: cyberdeck-os-amd64-${{ github.event.inputs.profile || 'full' }}
          path: |
            build/amd64/*.iso
            build/amd64/SHA256SUMS
          retention-days: 7
          if-no-files-found: error
