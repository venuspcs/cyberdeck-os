user www-data;
worker_processes 1;
error_log /var/log/cyberdeck-nomad-gate.log warn;
pid /run/cyberdeck-nomad-gate.pid;

load_module /usr/lib/nginx/modules/ngx_http_auth_pam_module.so;

events {
	worker_connections 256;
}

http {
	# A page load is many requests. This only stops a flood.
	# fail2ban bans repeated password failures.
	limit_req_zone $binary_remote_addr zone=nomad:10m rate=30r/s;

	map $http_upgrade $connection_upgrade {
		default upgrade;
		'' close;
	}

	server {
		listen 8443 ssl;
		listen [::]:8443 ssl;
		server_name _;

		ssl_certificate /etc/cyberdeck/nomad-gate/cert.pem;
		ssl_certificate_key /etc/cyberdeck/nomad-gate/key.pem;
		ssl_protocols TLSv1.2 TLSv1.3;

		location / {
			limit_req zone=nomad burst=200 nodelay;
			auth_pam "Cyberdeck login";
			auth_pam_service_name cyberdeck-nomad;
			proxy_pass http://127.0.0.1:8080;
			proxy_http_version 1.1;
			proxy_set_header Host $host;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection $connection_upgrade;
			proxy_read_timeout 3600s;
		}
	}

	# Open WebUI has no PAM. Every browser, including this computer,
	# comes through here so the trusted headers cannot be skipped.
	server {
		listen 3443 ssl;
		listen [::]:3443 ssl;
		server_name _;

		ssl_certificate /etc/cyberdeck/nomad-gate/cert.pem;
		ssl_certificate_key /etc/cyberdeck/nomad-gate/key.pem;
		ssl_protocols TLSv1.2 TLSv1.3;

		location / {
			limit_req zone=nomad burst=200 nodelay;
			auth_pam "Cyberdeck login";
			auth_pam_service_name cyberdeck-nomad;
			proxy_pass http://127.0.0.1:3000;
			client_max_body_size 100m;
			proxy_http_version 1.1;
			proxy_set_header Host $host;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection $connection_upgrade;
			proxy_set_header X-Forwarded-Email "";
			proxy_set_header X-Forwarded-User "";
			proxy_set_header X-Cyberdeck-Email "$remote_user@cyberdeck.local";
			proxy_set_header X-Cyberdeck-Name "$remote_user";
			proxy_read_timeout 3600s;
		}
	}
}
